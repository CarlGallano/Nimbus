<!DOCTYPE html>
<html lang="en" data-mode="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Live weather forecasts powered by Open-Meteo" />
  <title>Nimbus — Your weather, at a glance.</title>
  <script>
    try {
      var m = localStorage.getItem("nimbus-mode");
      if (m === "dark" || m === "light") document.documentElement.dataset.mode = m;
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app" id="app" data-theme="day">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>
          </svg>
        </span>
        <span class="brand-name">Nimbus</span>
      </div>
      <div class="topbar-actions">
        <button id="unit-btn" class="chip-btn" type="button" aria-label="Switch to Fahrenheit">
          <span id="unit-btn-label">°C</span>
        </button>
        <button id="mode-btn" class="icon-btn" type="button" title="Toggle dark mode" aria-label="Switch to dark mode">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20.5 14.6A8.6 8.6 0 0 1 9.4 3.5 8.6 8.6 0 1 0 20.5 14.6Z"/>
          </svg>
        </button>
      </div>
    </header>

    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">
        <path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/>
      </svg>
      <label for="search-input" class="visually-hidden">Search for a city</label>
      <input id="search-input" type="text" placeholder="Search city or airport..." autocomplete="off" spellcheck="false"
      role="combobox" aria-expanded="false" aria-controls="search-results" />
      <div id="search-results" class="search-results" role="listbox" hidden></div>
    </div>

    <main class="content">
      <section id="status" class="status" role="status" aria-live="polite" hidden></section>
      <section class="intro" aria-label="Location and date">
        <p class="intro-place">
          <span class="intro-pin" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11Z"/><circle cx="12" cy="10" r="2.6"/>
            </svg>
          </span>
          <span id="current-location">--</span>
          <button id="locate-btn" class="locate-btn" type="button" title="Use my location" aria-label="Use my location">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="7"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="2.4" fill="currentColor" stroke="none"/>
            </svg>
          </button>
        </p>
        <h1 class="intro-title">Your weather, at a glance.</h1>
        <p class="intro-date">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/>
          </svg>
          <span id="current-date">--</span>
        </p>
      </section>

      <section id="current" class="hero" hidden aria-label="Current conditions">
        <span class="live-pill"><span class="live-dot" aria-hidden="true"></span>Live conditions</span>

        <div class="hero-main">
          <div class="hero-readout">
            <p class="hero-temp"><span id="current-temp">--</span><span class="hero-deg" aria-hidden="true">°</span></p>
            <h2 class="condition" id="current-condition">--</h2>
          </div>
          <div class="hero-icon" id="current-icon" role="img" aria-label="Weather icon"></div>
        </div>

        <p class="hero-summary" id="current-summary">--</p>

        <div class="stat-row">
          <div class="stat">
            <span class="stat-head" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 8h11a3 3 0 1 0-3-3"/><path d="M3 12h15a3.5 3.5 0 1 1-3.5 3.5"/><path d="M3 16h6"/>
              </svg>
            </span>
            <span class="stat-label">Wind</span>
            <span class="stat-value" id="current-wind">--</span>
          </div>
          <div class="stat">
            <span class="stat-head" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3.5s5.5 6.2 5.5 10a5.5 5.5 0 1 1-11 0c0-3.8 5.5-10 5.5-10Z"/><path d="M9.5 14.5h5"/>
              </svg>
            </span>
            <span class="stat-label">Humidity</span>
            <span class="stat-value" id="current-humidity">--%</span>
          </div>
          <div class="stat">
            <span class="stat-head" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="4"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.4 5.4l1.7 1.7M16.9 16.9l1.7 1.7M5.4 18.6l1.7-1.7M16.9 7.1l1.7-1.7"/>
              </svg>
            </span>
            <span class="stat-label">UV index</span>
            <span class="stat-value" id="current-uv">--</span>
          </div>
        </div>
      </section>
      <section id="forecast" class="card" hidden>
        <p class="eyebrow">Today's outlook</p>
        <div class="card-head">
          <h2 class="card-title">Hourly forecast</h2>
          <button id="hours-toggle" class="link-btn" type="button" aria-expanded="false" aria-controls="hourly-list">
            <span id="hours-toggle-label">Details</span>
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m6 9 6 6 6-6"/>
            </svg>
          </button>
        </div>

        <div id="hourly-list" class="hourly-grid"></div>

        <div class="sun-row">
          <div class="sun-item">
            <span class="sun-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3.5v5.5"/><path d="m7.5 7.5 4.5 4.5 4.5-4.5"/><path d="M3.5 18h17"/><path d="M6 21h12"/>
              </svg>
            </span>
            <span class="sun-meta">
              <span class="sun-label">Sunrise</span>
              <span class="sun-value" id="current-sunrise">--</span>
              <span class="sun-sub" id="sunrise-sub">--</span>
            </span>
          </div>
          <div class="sun-item">
            <span class="sun-icon is-sunset" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 9.5V4"/><path d="m7.5 7.5 4.5-4.5 4.5 4.5"/><path d="M3.5 18h17"/><path d="M6 21h12"/>
              </svg>
            </span>
            <span class="sun-meta">
              <span class="sun-label">Sunset</span>
              <span class="sun-value" id="current-sunset">--</span>
              <span class="sun-sub" id="sunset-sub">--</span>
            </span>
          </div>
        </div>
      </section>

      <section id="daily" class="card" hidden>
        <p class="eyebrow">Plan ahead</p>
        <h2 class="card-title">6-day forecast</h2>
        <div id="daily-list" class="daily-grid"></div>
      </section>

      
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
